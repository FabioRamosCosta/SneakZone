<nav class="navbar navbar-expand-lg bg-dark">

    <div class="container">

        <a class="navbar-brand text-white"
           href="{% url 'home' %}">
            SneakZone
        </a>

        <div>

            <a class="btn btn-dark text-white"
               href="{% url 'home' %}">
                Home
            </a>

            <a class="btn btn-dark text-white"
               href="{% url 'produtos' %}">
                Produtos
            </a>

            <a class="btn btn-dark text-white"
               href="{% url 'sobre' %}">
                Sobre
            </a>

            {% if user.is_authenticated %}

                <a
                    href="{% url 'produto_novo' %}"
                    class="btn btn-primary">

                    + Novo produto

                </a>

                <form
                    method="post"
                    action="{% url 'logout' %}"
                    class="d-inline">

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-outline-light">

                        Sair

                    </button>

                </form>

            {% else %}

                <a
                    href="{% url 'login' %}"
                    class="btn btn-outline-light">

                    Entrar

                </a>

            {% endif %}

        </div>

    </div>

</nav>
