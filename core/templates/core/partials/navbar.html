<nav class="navbar navbar-expand-lg bg-dark">

    <div class="container">

        <a class="navbar-brand text-white"
           href="{% url 'home' %}">
            SneakZone
        </a>

        <div>

            <a class="btn btn-dark text-white"
               href="{% url 'home' %}">
                Home
            </a>

            <a class="btn btn-dark text-white"
               href="{% url 'produtos' %}">
                Produtos
            </a>

            <a class="btn btn-dark text-white"
               href="{% url 'sobre' %}">
                Sobre
            </a>

            {% if user.is_authenticated %}

                <span class="text-white me-2">
                    Olá, {{ user.first_name|default:user.username }}
                </span>

                {% if user.is_staff %}

                    <a
                        href="/admin/"
                        class="btn btn-outline-warning">

                        Administração

                    </a>

            

                <a
                    href="{% url 'produto_novo' %}"
                    class="btn btn-primary">

                    + Novo produto

                </a>

                    {% endif %}

                <form
                    method="post"
                    action="{% url 'logout' %}"
                    class="d-inline">

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-outline-light">

                        Sair

                    </button>

                </form>

            {% else %}

                <a
                    href="{% url 'login' %}"
                    class="btn btn-outline-light">

                    Entrar

                </a>

                <a
                    href="{% url 'cadastro' %}"
                    class="btn btn-success">

                    Criar conta

                </a>

            {% endif %}

        </div>

    </div>

</nav>
